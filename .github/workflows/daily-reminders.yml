name: Daily reminder emails

# Why this exists:
# Vercel's Hobby plan allows only 2 cron jobs. The 2 weekly digests occupy that
# allowance (still defined in vercel.json), so the 3 daily reminders never fired
# on Vercel. GitHub Actions triggers them instead — free and independent of the
# Vercel plan limit. Each run just calls the existing secured cron endpoint.
#
# TIMEZONE: GitHub cron is always UTC and does NOT observe daylight saving.
# The morning reminder must land at 08:30 Europe/Riga year-round, and Riga is
# UTC+3 in summer (EEST) / UTC+2 in winter (EET). So we wake the workflow at both
# candidate UTC times (05:30 and 06:30) and only actually send from the candidate
# that matches Riga's CURRENT UTC offset — DST-proof, and never double-sends
# because exactly one candidate matches on any given day. (Comparing the wall
# clock to "08:30" exactly does not work: GitHub routinely fires schedules
# 1-2 hours late, so the equality check silently skipped the send.)
# Midday/evening keep their original fixed-UTC schedule.
#
# NOTE: GitHub disables scheduled workflows after 60 days without any repo
# activity; a normal commit cadence keeps them alive.

on:
  schedule:
    - cron: "30 5 * * 1-5"  # morning candidate A — 08:30 Riga while EEST (summer)
    - cron: "30 6 * * 1-5"  # morning candidate B — 08:30 Riga while EET  (winter)
    - cron: "0 9 * * 1-5"   # midday  (Mon–Fri 09:00 UTC)
    - cron: "0 13 * * 1-5"  # evening (Mon–Fri 13:00 UTC)
  workflow_dispatch:
    inputs:
      path:
        description: "Cron path to trigger manually"
        required: true
        type: choice
        options:
          - daily-morning-reminder
          - daily-midday-reminder
          - daily-evening-reminder

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve endpoint from schedule
        id: pick
        run: |
          sched="${{ github.event.schedule }}"
          path=""
          case "$sched" in
            "30 5 * * 1-5"|"30 6 * * 1-5")
              # Morning: send from the candidate matching Riga's current UTC
              # offset (+0300 summer → 05:30 UTC, +0200 winter → 06:30 UTC).
              # Delay-proof: correct even when GitHub fires the schedule late.
              offset="$(TZ='Europe/Riga' date +%z)"
              if { [ "$sched" = "30 5 * * 1-5" ] && [ "$offset" = "+0300" ]; } || \
                 { [ "$sched" = "30 6 * * 1-5" ] && [ "$offset" = "+0200" ]; }; then
                path="daily-morning-reminder"
              else
                echo "Riga UTC offset is $offset — this candidate belongs to the other DST period; skipping."
              fi
              ;;
            "0 9 * * 1-5")  path="daily-midday-reminder" ;;
            "0 13 * * 1-5") path="daily-evening-reminder" ;;
            *)              path="${{ github.event.inputs.path }}" ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"
          if [ -n "$path" ]; then
            echo "Resolved endpoint: $path"
          fi

      - name: Call cron endpoint
        if: steps.pick.outputs.path != ''
        env:
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://www.shadowy.lv' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set" >&2
            exit 1
          fi
          url="${BASE_URL}/api/cron/${{ steps.pick.outputs.path }}"
          echo "GET $url"
          code=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url")
          echo "HTTP $code"
          echo "Response:"
          cat response.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Endpoint returned HTTP $code" >&2
            exit 1
          fi
